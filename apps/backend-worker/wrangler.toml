name = "jav-manager-telemetry"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[version_metadata]
binding = "WORKER_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "jav-manager"
database_id = "db53e6b2-5ef3-4631-930f-5ee09059f6d5"

[[kv_namespaces]]
binding = "JAVDB_KV"
# 使用 `wrangler kv namespace create JAVDB_KV` 创建后替换为实际 id
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "JAVDB_R2"
# 使用 `wrangler r2 bucket create <bucket>` 创建后替换为实际 bucket_name
bucket_name = "javdb-proxy-local"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
